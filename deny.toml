# cargo-deny configuration — the solo stand-in for a security/licensing review
# board (docs/07 §2, DP-E8). Anything this file permits, you personally maintain.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# UNLICENSED product: every dependency must be permissively licensed. Copyleft
# is not "review it later" — it is a deny, because a solo owner cannot absorb a
# licence surprise at release time.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# Our own crates are `publish = false` and licensed "UNLICENSED", which is not a
# parseable SPDX expression - so every workspace member was reported as
# `unlicensed` on the gate's first real run. Skipping *unpublished* crates is
# what this setting is for; it narrows the check to third-party code, which is
# the only code whose licence we do not already control (D-077).
private = { ignore = true }

[bans]
# DP-S1 "one of each hard thing": duplicate major versions of the same crate are
# the usual way a dependency graph doubles behind your back.
multiple-versions = "warn"
# A wildcard version on a *crates.io* dependency is the real hazard: it lets an
# upstream release change what you build without you doing anything. Kept as a
# deny for that reason.
wildcards = "deny"
# ...but every internal crate is declared `{ path = "..." }` with no version,
# which is the same syntax and none of the risk: a path dependency resolves
# inside this repo and cannot be moved by anyone else. Without this the gate
# reported 15 errors, all of them our own workspace edges (D-077).
allow-wildcard-paths = true
deny = [
  # DP-E1/DP-S5: the kernel must have no ambient I/O and must never speak to a
  # database on the host. Denying the clients structurally beats reviewing for it.
  { name = "tokio-postgres" },
  { name = "postgres" },
  { name = "diesel" },
  { name = "sqlx" },
  # DP-B9: no custom crypto, and no second hashing stack — blake3 is the one.
  { name = "openssl" },
  { name = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
