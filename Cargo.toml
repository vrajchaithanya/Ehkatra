[workspace]
resolver = "2"
# The shell is its own workspace, not a member (ADR-037 Amendment 1, D-116).
# Excluded explicitly so cargo does not adopt it by proximity — as a member it
# pushed the kernel dependency closure past its cap through version unification.
exclude = ["shell"]
members = [
  "crates/usk-types",
  "crates/usk-oplog",
  "crates/usk-state",
  "crates/usk-formula",
  "crates/usk-calc",
  "crates/usk-reduce",
  "crates/usk-sync",
  "crates/usk-recover",
  "crates/usk-json",
  "crates/usk-csv",
  "crates/usk-zip",
  "crates/usk-xml",
  "crates/usk-xlsx",
  "crates/usk-mcp",
  "crates/usk-view",
  "ehkatra-cli",
  "ehkatra-io",
  "ehkatra-mcp",
  "ehkatra-relay",
  "ehkatra-store",
  "tools/conformance",
  "tools/replay-check",
  "tools/tile-bench",
  "tools/calc-bench",
  "tools/recalc-profile",
  "tools/sync-bench",
  "tools/open-bench",
  "tools/image-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
# Proprietary: no crate here is ever published. Inherited by every member
# so an accidental `cargo publish` is refused by cargo itself, and so
# cargo-deny can tell our own crates from third-party ones (D-077).
publish = false

[workspace.dependencies]
blake3 = { version = "1", default-features = false }

