[workspace]
resolver = "2"
members = [
  "crates/usk-types",
  "crates/usk-oplog",
  "crates/usk-state",
  "crates/usk-formula",
  "crates/usk-calc",
  "crates/usk-reduce",
  "crates/usk-sync",
  "crates/usk-recover",
  "ehkatra-cli",
  "ehkatra-relay",
  "ehkatra-store",
  "tools/replay-check",
  "tools/tile-bench",
  "tools/calc-bench",
  "tools/sync-bench",
  "tools/open-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
blake3 = { version = "1", default-features = false }

